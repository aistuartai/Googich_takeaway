{% extends "base.html" %}
{% block title %}Settings · Googich Takeaway{% endblock %}
{% block content %}
<h1>Settings</h1>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
{% if saved %}<p class="result ok" role="status">Saved.</p>{% endif %}

<section class="card">
  <h2>Immich</h2>
  <form method="post" action="/settings/immich">
    <input type="hidden" name="csrf_token" value="{{ request.state.csrf }}">
    <label>Immich address
      <input name="url" value="{{ immich.url or '' }}" placeholder="http://immich:2283" required>
      <small>The address this app uses to reach Immich. A local network address is fine.</small>
    </label>
    <label>Public address (optional)
      <input name="public_url" value="{{ immich.public_url or '' }}" placeholder="https://photos.example.com">
      <small>Used only for links in this interface, if you open Immich at a different address.</small>
    </label>
    <label>API key
      <input name="api_key" type="password" autocomplete="off" placeholder="{{ 'Saved. Leave blank to keep it.' if immich.has_key else 'Paste a new API key' }}">
      <small>In Immich: Account Settings → API Keys. It needs the <code>asset.upload</code> and <code>asset.read</code> permissions. Stored encrypted; it is never shown again.</small>
    </label>
    <div class="actions">
      <button type="submit">Save</button>
      <button type="button" class="secondary" hx-post="/settings/immich/test" hx-target="#immich-test" hx-swap="innerHTML">Test connection</button>
    </div>
    <div id="immich-test" aria-live="polite"></div>
  </form>
</section>

<section class="card">
  <h2>Downloads</h2>
  <form method="post" action="/settings/general">
    <input type="hidden" name="csrf_token" value="{{ request.state.csrf }}">
    <label>Download folder
      <input name="staging" value="{{ general.staging or '' }}" placeholder="/data/staging" required>
      <small>Takeout archives are downloaded here before import. It needs room for one complete export.</small>
    </label>
    <label>Default time zone
      <input name="timezone" value="{{ general.timezone }}" placeholder="Australia/Melbourne" required>
      <small>Used only for photos with no time zone information of their own.</small>
    </label>
    <div class="actions"><button type="submit">Save</button></div>
  </form>
</section>
{% endblock %}
