<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Googich Takeaway{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body{% if request.state.csrf is defined %} hx-headers='{"X-CSRF-Token": "{{ request.state.csrf }}"}'{% endif %}>
  <header class="bar">
    <a class="brand" href="/">Googich Takeaway</a>
    {% if request.state.csrf is defined %}
    <nav>
      {% if immich_url %}<a href="{{ immich_url }}" target="_blank" rel="noopener noreferrer">Open Immich</a>{% endif %}
      <form method="post" action="/logout" class="inline">
        <input type="hidden" name="csrf_token" value="{{ request.state.csrf }}">
        <button type="submit" class="link">Log out</button>
      </form>
    </nav>
    {% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>Googich Takeaway {{ version }}</footer>
</body>
</html>
