[project]
name = "googich-takeaway"
version = "0.1.0.dev0"
description = "Self-hosted tool that moves Google Photos into Immich using Google Takeout archives."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "aistuartai" }]
requires-python = ">=3.13"
dependencies = [
    "pillow>=11",
    "tzdata>=2025.2",  # time zone database for images without system zoneinfo
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "ruff>=0.13",
    "mypy>=1.18",
]

[project.urls]
Homepage = "https://github.com/aistuartai/Googich_takeaway"
Issues = "https://github.com/aistuartai/Googich_takeaway/issues"
Changelog = "https://github.com/aistuartai/Googich_takeaway/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/googich_takeaway"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
