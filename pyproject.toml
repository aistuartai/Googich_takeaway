[project]
name = "googich-takeaway"
version = "0.6.2"
description = "Self-hosted tool that moves Google Photos into Immich using Google Takeout archives."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "aistuartai" }]
requires-python = ">=3.13"
dependencies = [
    "apprise>=1.9",
    "argon2-cffi>=25.1",
    "cryptography>=45",
    "fastapi>=0.118",
    "google-auth>=2.40",
    "httpx>=0.28",
    "jinja2>=3.1",
    "markdown>=3.8",
    "pillow>=11",
    "python-multipart>=0.0.20",
    "smbprotocol>=1.15",
    "tzdata>=2025.2",  # time zone database for images without system zoneinfo
    "uvicorn>=0.37",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "ruff>=0.13",
    "mypy>=1.18",
    "types-markdown>=3.10.2.20260712",
]
# The end-to-end tests under e2e/: real Docker and a real browser (uv run --group e2e pytest e2e).
e2e = [
    "pytest>=8",
    "playwright==1.63.0",
]

[project.scripts]
googich = "googich_takeaway.cli:main"

[project.urls]
Homepage = "https://github.com/aistuartai/Googich_takeaway"
Issues = "https://github.com/aistuartai/Googich_takeaway/issues"
Changelog = "https://github.com/aistuartai/Googich_takeaway/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/googich_takeaway"]

# The update helper's files ship inside the app too, so it can show their checksums, and the
# change log, so Help → Updates can show what each release brought.
[tool.hatch.build.targets.wheel.force-include]
"deploy/updater" = "googich_takeaway/updater_files"
"CHANGELOG.md" = "googich_takeaway/CHANGELOG.md"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"e2e/**" = ["S101"]

[tool.mypy]
strict = true
files = ["src", "tests", "e2e"]

[[tool.mypy.overrides]]
module = ["smbclient", "smbclient.*", "smbprotocol.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
faulthandler_timeout = 300  # a hung test dumps every thread's stack instead of waiting silently
