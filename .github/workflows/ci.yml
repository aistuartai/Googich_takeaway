name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 3.13 is the oldest supported; 3.14 is what the container image runs.
        python: ["3.13", "3.14"]
    name: test (Python ${{ matrix.python }})
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
      - name: Install
        run: uv sync --locked --group e2e  # e2e: so the type check covers e2e/ too
      - name: Lint
        run: uv run ruff check
      - name: Format
        run: uv run ruff format --check
      - name: Type check
        run: uv run mypy
      - name: Test
        run: uv run pytest

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          curl -fsSLo gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan full history
        run: ./gitleaks git --redact --no-banner .

  deploy:
    # The image as users run it: the example compose file, a real browser, and an upgrade from
    # the release users run today. Screenshots and logs are kept as the run's artifact.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      UV_PYTHON: "3.14"  # as the image runs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: googich:test
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
      - name: Install the browser
        run: |
          uv sync --locked --only-group e2e
          uv run --no-sync playwright install --with-deps chromium
      - name: End-to-end tests
        env:
          E2E_IMAGE: googich:test
        run: uv run --no-sync pytest e2e -v -p no:cacheprovider
      - name: Keep screenshots and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-artifacts
          path: e2e-artifacts/
          retention-days: 14
          if-no-files-found: ignore
