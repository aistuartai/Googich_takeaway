name: Release

on:
  push:
    # Final releases, and release candidates (vX.Y.Z-rcN), which are published as pre-releases.
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
      - name: Version in pyproject.toml must match the tag
        run: |
          version=$(uv version --short)
          expected="${GITHUB_REF_NAME#v}"
          expected="${expected/-rc/rc}"  # Python writes release candidate 1.2.3-rc1 as 1.2.3rc1
          test "${version}" = "${expected}" || { echo "pyproject has ${version}, tag is ${GITHUB_REF_NAME}"; exit 1; }
      - run: uv sync --locked --group e2e  # e2e: the type check covers e2e/ too
      - run: uv run ruff check
      - run: uv run mypy
      - run: uv run pytest

  image:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/googich_takeaway
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-rc') }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/googich_takeaway
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  release:
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          section="$version"
          case "$version" in *-rc*) section="Unreleased" ;; esac  # a candidate brings what is unreleased
          awk -v v="$section" '
            $0 ~ "^## \\[" v "\\]" { keep = 1; next }
            keep && /^## \[/ { exit }
            keep && /^\[[^]]+\]: / { next }
            keep { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for ${section}"; exit 1; }
          case "$version" in
            *-rc*) { printf '%s\n\n' "**Release candidate, for testing.** Offered only to installs that switch release candidates on (Help → Updates)."; cat notes.md; } > notes.tmp && mv notes.tmp notes.md ;;
          esac
          {
            echo
            echo "Image: \`ghcr.io/${GITHUB_REPOSITORY_OWNER}/googich_takeaway:${version}\`"
            echo "Digest: \`${{ needs.image.outputs.digest }}\`"
          } >> notes.md
      - name: Update helper files and their checksums
        run: |
          mkdir helper
          cp deploy/updater/googich-updater.sh deploy/updater/googich-updater.path \
             deploy/updater/googich-updater.service deploy/updater/install-updater.sh helper/
          (cd helper && sha256sum googich-updater.sh googich-updater.path \
             googich-updater.service install-updater.sh > SHA256SUMS)
          cat helper/SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: helper/*
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease=()
          case "${GITHUB_REF_NAME}" in *-rc*) prerelease=(--prerelease) ;; esac
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" \
            --notes-file notes.md --verify-tag "${prerelease[@]}" helper/*
