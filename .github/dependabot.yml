version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      uv:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
    ignore:
      # Python minor upgrades are a deliberate move: CI must test the new version first,
      # and dependencies need wheels for it (3.15 failed: no pydantic-core wheel, no compiler).
      - dependency-name: python
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
