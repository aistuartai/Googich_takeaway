# Googich Takeaway: example Docker Compose file.
#
#   1. Create the data folder and a master key for encrypting stored credentials, owned by the
#      app's user inside the container (uid 10001), and keep a copy of the key somewhere safe:
#        mkdir -p data secrets && chmod 700 data secrets
#        head -c 32 /dev/urandom | base64 > secrets/master.key && chmod 600 secrets/master.key
#        chown -R 10001:10001 data secrets
#   2. docker compose up -d
#   3. docker compose logs googich | grep "First-run setup"   # the one-time setup token
#   4. Open http://<this host>:8080/setup straight away: until a password is set, anyone on the
#      network who has the token could set it.
#
# The version is pinned so it only changes when you choose: edit it here (or press Update now
# with the optional update helper) when a new release is out.
#
# The data folder holds the state database and logs. Downloaded archives go to the download folder
# chosen in Settings: /data/staging below, or an SMB share (no mount needed).

services:
  googich:
    image: ghcr.io/aistuartai/googich_takeaway:0.3.5
    container_name: googich
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: Australia/Melbourne
      GOOGICH_MASTER_KEY_FILE: /run/secrets/master_key
      # Behind an HTTPS reverse proxy (Nginx Proxy Manager, Caddy, Traefik), optionally its IP
      # address, so the session cookie is marked secure and logins are throttled per visitor.
      # GOOGICH_TRUSTED_PROXIES: 192.168.1.10
    secrets:
      - master_key
    volumes:
      - ./data:/data
      # A large local disk for downloads, if not using an SMB share. Choose /data/staging in Settings.
      # - /mnt/big-disk/googich:/data/staging
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Ceilings, so a damaged or hostile archive cannot take the whole host down with it. A
    # normal import stays well under these.
    mem_limit: 2g
    pids_limit: 256
    # The app's own unprivileged user. ./data and secrets/ must belong to it (step 1). To run as
    # another user, change this and chown the folders to match.
    user: "10001:10001"

secrets:
  master_key:
    file: ./secrets/master.key
